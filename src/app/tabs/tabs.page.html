<ion-tabs (ionTabsDidChange)="onTabChange($event.tab)">
  <ion-tab-bar slot="bottom" class="ab-tabbar">
    <ion-tab-button *ngFor="let t of tabs" [tab]="t.id" [href]="'/tabs/' + t.id">
      <span class="ab-tabbar__icon">
        <ion-icon [name]="selectedTab === t.id ? t.icon : t.icon + '-outline'"></ion-icon>
      </span>
      <ion-label>{{ t.label }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
