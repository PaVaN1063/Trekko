<ion-content class="ab-page" [fullscreen]="true">
  <ab-header [back]="true" backHref="/tabs/account" title="Profile" subtitle="Used on your tickets and invoices" [tall]="true"></ab-header>

  <form class="ab-body" #f="ngForm" (ngSubmit)="save()">
    <div class="avatar rise">
      <img [src]="profileImage" alt="Profile photo" />
      <button type="button" class="avatar__cam tap" aria-label="Change photo" (click)="triggerFileInput()">
        <ion-icon name="camera"></ion-icon>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden (change)="onFileSelected($event)" />
    </div>

    <section class="panel rise" style="--i: 1">
      <label class="field">
        <span>Full name</span>
        <input name="name" [(ngModel)]="profile.name" required minlength="2" autocomplete="name" />
      </label>
      <label class="field">
        <span>Email <em class="verified"><ion-icon name="checkmark-circle"></ion-icon>Verified</em></span>
        <input name="email" type="email" [(ngModel)]="profile.email" required autocomplete="email" pattern="[^@\s]+@[^@\s]+\.[^@\s]+" />
      </label>
      <label class="field">
        <span>Mobile <em class="verified"><ion-icon name="checkmark-circle"></ion-icon>Verified</em></span>
        <input name="phone" [value]="'+91 ' + profile.phone" disabled />
      </label>
      <div class="field">
        <span>Gender</span>
        <div class="gender">
          <button type="button" class="chip" *ngFor="let g of genders" [class.is-on]="profile.gender === g" (click)="profile.gender = g">{{ g }}</button>
        </div>
      </div>
      <label class="field">
        <span>Date of birth</span>
        <input name="dob" type="date" [(ngModel)]="profile.dob" [max]="toDay" />
      </label>
    </section>

    <section class="section rise" style="--i: 2">
      <div class="section-head"><h2>Notifications</h2></div>
      <div class="panel toggles">
        <label class="toggle-row" *ngFor="let n of notifications">
          <span>
            <b>{{ n.label }}</b>
            <small class="muted">{{ n.hint }}</small>
          </span>
          <ion-toggle [name]="n.id" [(ngModel)]="n.on" [attr.aria-label]="n.label"></ion-toggle>
        </label>
      </div>
    </section>

    <button type="submit" class="btn-cta save" [disabled]="f.invalid || saving">
      {{ saving ? 'Saving…' : 'Save changes' }}
    </button>
  </form>
</ion-content>
