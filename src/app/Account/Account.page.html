<ion-content class="ab-page" [fullscreen]="true">
  <header class="me">
    <img class="me__contours" src="assets/illustrations/abstract.png" alt="" aria-hidden="true" />
    <div class="me__row rise">
      <img class="me__avatar" [src]="user.avatar" alt="" />
      <div class="me__text">
        <h1>{{ user.name }}</h1>
        <p>+91 {{ user.phone }}</p>
      </div>
      <a class="ab-icon-btn" routerLink="profile" aria-label="Edit profile"><ion-icon name="create-outline"></ion-icon></a>
    </div>

    <div class="me__stats rise" style="--i: 1">
      <div><b>{{ user.treksDone }}</b><small>Treks done</small></div>
      <div><b>{{ user.kmWalked }} km</b><small>On the trail</small></div>
      <div><b>{{ upcoming }}</b><small>Upcoming</small></div>
    </div>
  </header>

  <div class="ab-body">
    <!-- Referral -->
    <section class="refer rise" style="--i: 2">
      <div>
        <strong>Give ₹200, get ₹200</strong>
        <small>Share code <b>ANANYA200</b> with a friend.</small>
      </div>
      <button type="button" class="refer__btn" (click)="shareCode()">Invite</button>
    </section>

    <section class="section rise" *ngFor="let group of menu; let gi = index" [style.--i]="gi + 3">
      <div class="section-head"><h2>{{ group.title }}</h2></div>
      <nav class="panel menu">
        <a class="menu__item" *ngFor="let item of group.items" [routerLink]="item.link" [class.menu__item--danger]="item.danger">
          <span class="menu__icon"><ion-icon [name]="item.icon"></ion-icon></span>
          <span class="menu__label">
            {{ item.label }}
            <small *ngIf="item.hint" class="muted">{{ item.hint }}</small>
          </span>
          <ion-icon *ngIf="!item.danger" class="menu__chev" name="chevron-forward"></ion-icon>
        </a>
      </nav>
    </section>

    <p class="version muted">Trekko · version 1.4.0</p>
  </div>
</ion-content>
