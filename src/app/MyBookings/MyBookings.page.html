<ion-content>
  <div class="custom-header">
    <h5>Trek Bookings</h5>
    <!-- Right-end Dropdown -->
    <div class="dropdown">
      <button
        class="btn btn-outline-secondary btn-sm dropdown-toggle custom-dropdown-toggle"
        type="button"
        id="dropdownMenuButton"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        All Bookings
      </button>
      <ul
        class="dropdown-menu dropdown-menu-end"
        aria-labelledby="dropdownMenuButton"
      >
        <li><a class="dropdown-item" href="#">All Bookings</a></li>
        <li><a class="dropdown-item" href="#">Incoming</a></li>
        <li><a class="dropdown-item" href="#">Completed</a></li>
        <li><a class="dropdown-item" href="#">Cancelled</a></li>
        <li><a class="dropdown-item" href="#">Rejected</a></li>
      </ul>
    </div>
  </div>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div *ngFor="let record of records">
    <ion-card
      routerLink="/tabs/Home/trip-details"
      class="custom-card"
    >
      <ion-card-content class="card-content">
        <ion-row class="departure-bookingId">
          <ion-col size="8">
            <ion-text class="date-time">Departure Date & Time</ion-text>
          </ion-col>
          <ion-col size="4"><p class="booking-id">Booking ID: XXXXXX</p></ion-col>
        </ion-row>
        <ion-row class="content-rows">
          <ion-col size="12">
            <ion-text class="service-provider">{{ record.serviceProvider }}</ion-text>
          </ion-col>
        </ion-row>
        <ion-row class="content-rows">
          <ion-col size="12">
            <ion-text class="trek-duration">{{ record.trekDuration }}</ion-text>
          </ion-col>
        </ion-row>
        <ion-row class="content-rows">
          <ion-col size="12">
            <ion-text class="pickup-date-time">{{ record.pickupDateTime }}</ion-text>
          </ion-col>
        </ion-row>
      </ion-card-content>
  
      <div class="side-section">
        <ion-text class="view-ticket">View Ticket</ion-text>
      </div>
    </ion-card>
    
    <div class="status-section">
      <ion-text 
        class="status"
        [ngClass]="{
          'incoming-status': record.status === 'Incoming',
          'completed-status': record.status === 'Completed',
          'cancelled-status': record.status === 'Cancelled',
          'rejected-status': record.status === 'Rejected'
        }"
      >
        {{ record.status }}
      </ion-text>
    </div>
    
  </div>
  
  <ion-row *ngIf="transactionData === false" class="ion-justify-content-center">
    <ion-col>
      <ion-img
        src="../../assets/illustrations/NoResultsFound.jpg"
        alt="Not Found"
        style="max-width: 700px; height: auto"
      ></ion-img>
    </ion-col>
  </ion-row>
</ion-content>
