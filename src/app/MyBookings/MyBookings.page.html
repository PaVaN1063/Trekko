<ion-content [fullscreen]="true">
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-buttons slot="end" style="padding-top: 20px;"></ion-buttons>
  <h2>Treck Bookings</h2>
  <ion-card *ngFor="let record of records" routerLink="/tabs/Home/trip-details">


      <div class="header-content">
      <ion-col size="6">
        <ion-text class="textHeading"
          ><b>Depature date :</b></ion-text
        >
      </ion-col>
      <ion-col size="6">
        <ion-text>{{record.pickupDateTime}}</ion-text>
      </ion-col>

    </div>
          <!-- Special Offer Badge -->
          <ion-badge
          color="success"
          style="position: absolute; top: 10px; right: 10px"
        >
        <ion-text>Booking ID:</ion-text>
          {{record.specialOffer}}
        </ion-badge>
    
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-text class="textHeading"
              ><b>Name :</b></ion-text
            >
          </ion-col>
          <ion-col size="6">
            <ion-text>{{record.serviceProvider}}</ion-text>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="6">
            <ion-text>Trek Duration:</ion-text>
          </ion-col>
          <ion-col size="6">
            <ion-text>{{record.trekDuration}}</ion-text>
          </ion-col>
        </ion-row>
        <ion-row>
          <ion-col size="6">
            <ion-text class="textHeading"><b>Pickup :</b></ion-text>
          </ion-col>
          <ion-col size="6">
            <ion-text>{{record.pickupDateTime}}</ion-text>
          </ion-col>
        </ion-row>
      </ion-grid>
      <!-- Special Offer Badge -->
      <!-- <ion-badge
        color="success"
        style="position: absolute; top: 10px; right: 10px"
      >
        {{record.specialOffer}}
      </ion-badge> -->
    </ion-card-content>
  </ion-card>

  <ion-row *ngIf="transactionData === false" class="ion-justify-content-center">
    <ion-col>
      <ion-img
        src="../../assets/illustrations/NoResultsFound.jpg"
        alt="Not Found"
        style="max-width: 700px; height: auto"
      ></ion-img>
    </ion-col>
  </ion-row>
</ion-content>
