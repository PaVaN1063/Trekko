<ion-content>
  <div class="custom-header">
    <h5 >Trek Bookings</h5>
    <!-- Right-end Dropdown -->
    <div class="dropdown">
      <button
        class="btn btn-outline-secondary btn-sm dropdown-toggle custom-dropdown-toggle"
        type="button"
        id="dropdownMenuButton"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        All Bookings
      </button>
      <ul
        class="dropdown-menu dropdown-menu-end"
        aria-labelledby="dropdownMenuButton"
      >
        <li><a class="dropdown-item" href="#">Action 1</a></li>
        <li><a class="dropdown-item" href="#">Action 2</a></li>
        <li><a class="dropdown-item" href="#">Action 3</a></li>
      </ul>
    </div>
  </div>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <ion-card
    *ngFor="let record of records"
    routerLink="/tabs/Home/trip-details"
    class="custom-card"
  >
    <div class="card-header">
      <div class="logo-and-name">
        <img src="{{record.logoImage}}" alt="Logo" class="service-logo" />
        <ion-text class="service-provider">{{record.serviceProvider}}</ion-text>
      </div>
      <img
        *ngIf="record.specialOffer"
        src="../../assets/Logos/offers.png"
        alt="Special Offer"
        class="special-offer"
      />
    </div>

    <ion-card-content class="card-content">
      <ion-row>
        <ion-col size="12">
          <ion-text class="trek-duration">{{record.trekDuration}}</ion-text>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-text class="pickup-date-time"
            >{{record.pickupDateTime}}</ion-text
          >
        </ion-col>
      </ion-row>
    </ion-card-content>
    <div class="side-section">
      <br />
      <div class="side-info">
        <label class="price-label">XXXX</label>
        <br />
        <label>Onwards</label>
        <br />
        <img
          src="../../assets/Logos/gdpr.png"
          alt="GDPR Icon"
          class="side-img-icon"
        />
      </div>
      <ion-text class="view-itinerary">View Itinerary</ion-text>
    </div>
  </ion-card>

  <ion-row *ngIf="transactionData === false" class="ion-justify-content-center">
    <ion-col>
      <ion-img
        src="../../assets/illustrations/NoResultsFound.jpg"
        alt="Not Found"
        style="max-width: 700px; height: auto"
      ></ion-img>
    </ion-col>
  </ion-row>
</ion-content>
