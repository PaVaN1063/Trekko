<ion-content class="share">
  <div class="share__head">
    <h2>Share this trek</h2>
    <button type="button" class="share__close" aria-label="Close" (click)="dismissModal()">
      <ion-icon name="close"></ion-icon>
    </button>
  </div>

  <div class="share__trek panel">
    <img [src]="trek.image" [alt]="trek.name" />
    <div>
      <strong>{{ trek.name }}</strong>
      <small class="muted">{{ trek.departure | date: 'EEE, d MMM' : '+0530' }} · {{ duration }} · {{ trek.price | inr }}</small>
    </div>
  </div>

  <div class="share__grid">
    <button type="button" class="share__target tap rise" *ngFor="let t of targets; let i = index" [style.--i]="i" (click)="share(t.id)">
      <span class="share__icon" [style.background]="t.bg"><ion-icon [name]="t.icon"></ion-icon></span>
      <span>{{ t.label }}</span>
    </button>
  </div>

  <p class="share__note muted">Friends who book with your link get ₹200 off. You get ₹200 credit after their trek.</p>
</ion-content>
