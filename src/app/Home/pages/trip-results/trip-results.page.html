<ion-content>
  <ion-toolbar style="--background: #f8f8f8">
    <ion-title>
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <label class="headerTitle"
            >{{ formData?.from }} - {{ formData?.to }}</label
          ><br />
          <span style="font-size: 12px"
            >Departure Date: {{ formData?.departureDay }}</span
          >
        </div>
        <div>
          <label class="custom-values">
            <span
              *ngIf="formData?.custom?.length > 0"
              style="
                font-size: 13px;
                background-color: rgb(69, 219, 0);
                padding-left: 6px;
                padding-right: 6px;
                padding-top: 4px;
                padding-bottom: 4px;
                border-radius: 20px;
              "
            >
              {{ formData.custom.join(', ') }}
            </span>
            <span *ngIf="!formData?.custom?.length"></span>
          </label>
        </div>
      </div>
    </ion-title>
  </ion-toolbar>

  <div class="custom-header-2">
    <img
        src="../../assets/Logos/multiple-users-silhouette.png"
        class="headerImg"
        alt="Group Icon"
      />
      <ion-label class="booking-label">Booking for Groups</ion-label>
      <ion-button fill="clear" color="primary" class="know-more-btn"
        >Know More</ion-button
      >
      <ion-toggle slot="end"></ion-toggle>
  </div>

  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="swiper-container" style="margin-top: 5px">
    <div class="swiper-wrapper">
      <div class="swiper-slide" *ngFor="let tab of tabs">
        <ion-chip [outline]="true">
          <span>
            <img [src]="tab.icon" style="width: 20px" />
            <ion-label style="margin-left: 2px"> {{tab.title}}</ion-label>
          </span>
        </ion-chip>
      </div>
    </div>
  </div>

  <ion-card
  *ngFor="let record of records"
  class="custom-card"
  routerLink="/tabs/Home/trip-details"
>
  <div class="card-header">
    <div class="logo-and-name">
      <img src="{{record.logoImage}}" alt="Logo" class="service-logo" />
      <ion-text class="service-provider">{{record.serviceProvider}}</ion-text>
    </div>
    <img
      *ngIf="record.specialOffer"
      src="../../assets/Logos/offers.png"
      alt="Special Offer"
      class="special-offer"
    />
  </div>

  <ion-card-content class="card-content">
    <ion-row>
      <ion-col size="12">
        <ion-text class="trek-duration">{{record.trekDuration}}</ion-text>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-text class="pickup-date-time">{{record.pickupDateTime}}</ion-text>
      </ion-col>
    </ion-row>
  </ion-card-content>
  <div class="side-section">
    <br />
    <div class="side-info">
      <label class="price-label">XXXX</label>
      <br />
      <label>Onwards</label>
      <br />
      <img
        src="../../assets/Logos/gdpr.png"
        alt="GDPR Icon"
        class="side-img-icon"
      />
    </div>
    <ion-text class="view-itinerary">View Itinerary</ion-text>
  </div>
</ion-card>

  <ion-row *ngIf="transactionData === false" class="ion-justify-content-center">
    <ion-col>
      <ion-img
        src="../../assets/illustrations/NoResultsFound.jpg"
        alt="Not Found"
        style="max-width: 700px; height: auto"
      ></ion-img>
    </ion-col>
  </ion-row>
</ion-content>
