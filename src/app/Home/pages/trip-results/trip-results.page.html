<ion-header [translucent]="true">
  <ion-toolbar>
    <div lines="none" class="">
      <span class="date-day-label">Date & Day</span>
      <span class="">02/09/2024 - Monday</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="fixed-content">
    <ion-item lines="none" class="group-booking-item">
      <ion-icon name="people-outline" slot="start" size="small"></ion-icon>
      <ion-label class="booking_title">Booking for Groups</ion-label>

      <ion-label slot="end" class="small-label">Known More</ion-label>
      <ion-toggle slot="end" class="small-toggle"></ion-toggle>
    </ion-item>
    <div class="custom-divider"></div>

    <div class="chip-scroll">
      <div class="chip-container">
        <ion-chip *ngFor="let menu of menus" outline="true">
          <ion-label>{{ menu.title }}</ion-label>
        </ion-chip>
      </div>
    </div>
  </div>

  <div class="scrollable-content">
    <ion-card *ngFor="let record of records">
      <img
        *ngIf="record.hasSpecialOffer"
        src="../../assets/illustrations/special-offer-tag.jpg"
        alt="Special Offer"
        class="special-offer-image"
      />
      <ion-card-content>
        <ion-grid>
          <ion-row>
            <ion-col size="6">
              <ion-text class="textHeading"
                ><b>Name of the Service Provider:</b></ion-text
              >
            </ion-col>
            <ion-col size="6">
              <ion-text>{{ record.serviceProvider }}</ion-text>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">
              <ion-text>Trek Duration:</ion-text>
            </ion-col>
            <ion-col size="6">
              <ion-text>{{ record.trekDuration }}</ion-text>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col size="6">
              <ion-text class="textHeading"
                ><b>Pickup Date & Time:</b></ion-text
              >
            </ion-col>
            <ion-col size="6">
              <ion-text>{{ record.pickupDateTime }}</ion-text>
            </ion-col>
          </ion-row>
        </ion-grid>
        <ion-badge
          color="success"
          style="position: absolute; top: 10px; right: 10px"
        >
          {{ record.specialOffer }}
        </ion-badge>
      </ion-card-content>
    </ion-card>

    <ion-row
      *ngIf="transactionData === false"
      class="ion-justify-content-center"
    >
      <ion-col>
        <ion-img
          src="../../assets/illustrations/NoResultsFound.jpg"
          alt="Not Found"
          style="max-width: 700px; height: auto"
        ></ion-img>
      </ion-col>
    </ion-row>
  </div>
</ion-content>
