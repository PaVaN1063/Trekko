<ion-content>
  <div class="custom-header">
    <button class="back-button" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>
    <h4 style="margin-left: 10px;">Offers</h4>
  </div>
  <div class="custom-header-2">
    <img
        src="../../assets/Logos/multiple-users-silhouette.png"
        class="headerImg"
        alt="Group Icon"
      />
      <ion-label class="booking-label">Booking for Groups</ion-label>
      <ion-button fill="clear" color="primary" class="know-more-btn"
        >Know More</ion-button
      >
      <ion-toggle slot="end"></ion-toggle>
  </div>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div class="swiper-container">
    <div class="swiper-wrapper">
      <div class="swiper-slide" *ngFor="let tab of tabs">
        <ion-chip [outline]="true">
          <span>
            <img [src]="tab.icon" style="width: 20px" />
            <ion-label style="margin-left: 2px"> {{tab.title}}</ion-label>
          </span>
        </ion-chip>
      </div>
    </div>
    <div class="swiper-pagination"></div>
  </div>

  <ion-card
    *ngFor="let record of records"
    routerLink="/tabs/Home/trip-details"
    class="custom-card"
  >
    <div class="card-header">
      <div class="logo-and-name">
        <img src="{{record.logoImage}}" alt="Logo" class="service-logo" />
        <ion-text class="service-provider">{{record.serviceProvider}}</ion-text>
      </div>
      <img
        *ngIf="record.specialOffer"
        src="../../assets/Logos/offers.png"
        alt="Special Offer"
        class="special-offer"
      />
    </div>

    <ion-card-content class="card-content">
      <ion-row>
        <ion-col size="12">
          <ion-text class="trek-duration">{{record.trekDuration}}</ion-text>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-text class="pickup-date-time"
            >{{record.pickupDateTime}}</ion-text
          >
        </ion-col>
      </ion-row>
    </ion-card-content>
    <div class="side-section">
      <br />
      <div class="side-info">
        <label class="price-label">XXXX</label>
        <br />
        <label>Onwards</label>
        <br />
        <img
          src="../../assets/Logos/gdpr.png"
          alt="GDPR Icon"
          class="side-img-icon"
        />
      </div>
      <ion-text class="view-itinerary">View Itinerary</ion-text>
    </div>
  </ion-card>

  <ion-row *ngIf="transactionData === false" class="ion-justify-content-center">
    <ion-col>
      <ion-img
        src="../../assets/illustrations/NoResultsFound.jpg"
        alt="Not Found"
        style="max-width: 700px; height: auto"
      ></ion-img>
    </ion-col>
  </ion-row>
</ion-content>
