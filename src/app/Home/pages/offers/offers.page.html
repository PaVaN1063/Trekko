<ion-content class="ab-page" [fullscreen]="true">
  <ab-header [back]="true" title="Offers" subtitle="Apply the code at checkout"></ab-header>
  <div class="ab-body">
    <div class="codes rail">
      <button type="button" class="code tap" *ngFor="let t of offerTreks" (click)="copy(t.offer!.code)">
        <span class="code__label">{{ t.offer!.label }}</span>
        <span class="code__trek">{{ t.name }}</span>
        <span class="code__chip">
          {{ t.offer!.code }}
          <ion-icon [name]="copied === t.offer!.code ? 'checkmark' : 'copy-outline'"></ion-icon>
        </span>
      </button>
    </div>
    <ab-trek-list [treks]="offerTreks" [initialFilters]="['offer']"></ab-trek-list>
  </div>
</ion-content>
