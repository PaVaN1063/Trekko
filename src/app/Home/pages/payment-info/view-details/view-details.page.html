
<ion-content class="content">
  <div class="custom-toolbar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px;">
    <h4 style="margin-right: 10px;">Trek Booking Details</h4>
    <ion-buttons slot="start" (click)="dismissModal()">
      <ion-button>X</ion-button>
    </ion-buttons>   
  </div>
  

  
  <ion-list>
    <ion-item lines="none"> 
      <ion-label>
        <h2>Trek booking Details</h2>
        <p>Name of the service provider</p>
        <p>No. of Slots</p>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-label>
        <h2>Passenger Details</h2>
        <p>Name of the Passenger</p>
        <p>Gender</p>
        <p>Age Year</p>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-label>
        <h2>Your Ticket will be sent to</h2>
        <p>Mobile Number</p>
        <p>Gmail ID</p>
        <p>State of Residency</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
