<ion-header>
  <ion-toolbar class="custom-toolbar">
    <ion-title>Trek Booking Details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismissModal()">X</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content >
  <ion-list>
    <ion-item lines="none"> 
      <ion-label>
        <h2>Trek booking Details</h2>
        <p>Name of the service provider</p>
        <p>No. of Slots</p>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-label>
        <h2>Passenger Details</h2>
        <p>Name of the Passenger</p>
        <p>Gender</p>
        <p>Age Year</p>
      </ion-label>
    </ion-item>

    <ion-item lines="none">
      <ion-label>
        <h2>Your Ticket will be sent to</h2>
        <p>Mobile Number</p>
        <p>Gmail ID</p>
        <p>State of Residency</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
