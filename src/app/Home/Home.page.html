<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>
  <div
    class="advertise-space"
    style="background-color: transparent; height: 30px"
  ></div>
  <div class="title" style="padding-left: 20px; font-weight: 500">
    <h3 style="font-weight: 500">Trip Tickets</h3>
  </div>
  <div class="card head-card mx-1 my-1 shadow" style="border-radius: 10px; padding: 10px">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #tripForm="ngForm">
        <div class="mb-2"> <!-- Increased margin-bottom -->
          <label for="fromInput" class="form-label" style="font-size: 14px">From</label>
          <input
            type="text"
            class="form-control"
            id="fromInput"
            [(ngModel)]="from"
            name="from"
            required
            style="font-size: 14px; padding: 8px" 
          />
        </div>
  
        <div class="mb-2"> <!-- Increased margin-bottom -->
          <label for="toInput" class="form-label" style="font-size: 14px">To</label>
          <input
            type="text"
            class="form-control"
            id="toInput"
            [(ngModel)]="to"
            name="to"
            required
            style="font-size: 14px; padding: 8px"
          />
        </div>
  
        <div class="d-flex align-items-center mb-2"> <!-- Increased margin-bottom -->
          <div class="me-2" style="flex: 0 0 60px"> <!-- Increased width -->
            <label for="departureDay" class="form-label" style="font-size: 14px">Departure Day</label>
            <input
              type="date"
              class="form-control"
              id="departureDay"
              [(ngModel)]="departureDay"
              name="departureDay"
              required
              style="font-size: 14px; padding: 8px" 
            />
          </div>
  
          <div class="d-flex flex-wrap">
            <ion-chip
              style="
                width: 110px; 
                height: auto;
                font-size: 8px; 
                padding: 5px;
                display: flex;
                justify-content: center;
                align-items: center;
              "
              [outline]="!isWeekendTrekSelected"
              (click)="toggleWeekendTrek()"
              [ngClass]="{'selected': isWeekendTrekSelected}"
            >
              <ion-label>Weekend Trek</ion-label>
              <ion-icon *ngIf="isWeekendTrekSelected" name="close"></ion-icon>
            </ion-chip>
            <ion-chip
              style="
                width: 110px;
                font-size: 8px;
                padding: 5px;
                display: flex;
                justify-content: center;
                align-items: center;
              "
              [outline]="!isPersonalizedTrekSelected"
              (click)="togglePersonalizedTrek()"
              [ngClass]="{'selected': isPersonalizedTrekSelected}"
            >
              <ion-label>Personalized Trek</ion-label>
              <ion-icon *ngIf="isPersonalizedTrekSelected" name="close"></ion-icon>
            </ion-chip>
          </div>
        </div>
  
        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-warning rounded-pill"
            [disabled]="!tripForm.valid"
            style="font-size: 14px; padding: 6px 12px" 
          >
            <i class="fa-solid fa-shoe-prints"></i> Search
          </button>
        </div>
      </form>
    </div>
  </div>
  

  <div class="Section-2">
    <div class="top-trips-card" style="padding: 0">
      <div
        class="d-flex justify-content-between align-items-center section-header"
        style="margin-bottom: 0; padding: 5px 0"
      >
        <h2 class="ms-3 mb-0" style="font-size: 14px; margin: 0">Top Treks</h2>
        <ion-button
          fill="clear"
          size="small"
          routerLink="top-trips"
          style="text-transform: none; font-size: 12px; padding: 0"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper">
          <div
            class="swiper-slide"
            *ngFor="let slide of slides; let i = index"
            [ngStyle]="{'margin-left': i === 0 ? '10px' : '0px'}"
            style="margin-right: 10px; padding-right: 0px"
          >
          

            <ion-card
              class="card"
              routerLink="/tabs/Home/trip-details"
              style="
                width: 100px;
                height: 100px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                margin: 0;
              "
            >
              <img
                routerLink="/tabs/Home/trip-details"
                [src]="slide.image"
                alt="{{ slide.title }}"
                style="
                  width: 100px;
                  height: 100px;
                  border-radius: 20px;
                  overflow: hidden;
                  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                "
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>

    <div class="offers-card" style="padding: 0">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0;
          padding: 5px 0;
        "
      >
        <h2 class="ms-3 mb-0" style="font-size: 14px; margin: 0">Offers</h2>
        <ion-button
          fill="clear"
          size="small"
          routerLink="offers"
          style="text-transform: none; font-size: 12px; padding: 0"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper" style="padding-right: 20px">
       
          <div
            class="swiper-slide"
            *ngFor="let slide of slides1; let i = index"
            [ngStyle]="{'margin-left': i === 0 ? '10px' : '0px'}"
            style="margin-right: 10px; padding-right: 0px"
          >
          

            <ion-card
              class="card"
              routerLink="/tabs/Home/offers"
              style="
                width: 100px;
                height: 100px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                margin: 0;
              "
            >
              <img
                [src]="slide.image"
                alt="{{ slide.title }}"
                style="
                  width: 100px;
                  height: 100px;
                  border-radius: 20px;
                  overflow: hidden;
                "
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>

    <div class="trek-shorts-card" style="padding: 0">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0;
          padding: 5px 0;
        "
      >
        <h2 class="ms-3 mb-0" style="font-size: 14px; margin: 0">
          Trek Shorts
        </h2>
        <ion-button
          fill="clear"
          size="small"
          routerLink="offers"
          style="text-transform: none; font-size: 12px; padding: 0"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper" style="padding-right: 20px">
        
          <div
            class="swiper-slide"
            *ngFor="let slide of slides2; let i = index"
            [ngStyle]="{'margin-left': i === 0 ? '10px' : '0px'}"
            style="margin-right: 10px; padding-right: 0px"
          >
            <ion-card
              class="card"
              routerLink="/tabs/Home/offers"
              style="
                width: 100px;
                height: 100px;
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                margin: 0;
              "
            >
              <img
                [src]="slide.image"
                alt="{{ slide.title }}"
                style="
                  width: 100px;
                  height: 100px;
                  border-radius: 20px;
                  overflow: hidden;
                "
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>

    <div class="weather-section">
      <div class="weather-cards">
        <ion-card
          *ngFor="let alert of weatherAlerts"
          style="height: 160px; border-radius: 20px"
          [ngStyle]="{'background-image': alert.backgroundImage, 'background-size': 'cover','background-repeat': 'no-repeat'}"
        >
          <div
            class="content"
            style="position: relative; height: 100%; padding: 20px"
          >
            <!-- City and Time -->
            <label style="color: white; font-size: 20px; font-weight: bold"
              >{{ alert.city }}</label
            ><br />
            <label style="color: white; font-size: 15px; font-weight: bold"
              >{{ alert.time }}</label
            ><br />
            <label
              style="
                color: white;
                font-size: 15px;
                font-weight: bold;
                margin-top: 60px;
              "
              >{{ alert.condition }}</label
            >

            <!-- Temperature positioned at the top right corner -->
            <label
              style="
                color: white;
                font-size: 45px;
                position: absolute;
                top: 20px;
                right: 20px;
              "
            >
              {{ alert.temperature }}°
            </label>

            <!-- High/Low positioned at the bottom right corner -->
            <label
              style="
                color: white;
                font-size: 15px;
                font-weight: bold;
                position: absolute;
                bottom: 20px;
                right: 20px;
              "
            >
              H:{{ alert.high }}° L:{{ alert.low }}°
            </label>
          </div>
        </ion-card>
      </div>
    </div>
  </div>
</ion-content>
