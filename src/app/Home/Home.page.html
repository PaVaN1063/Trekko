<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="title" style="padding-left: 20px; font-weight: 500">
    <h3 style="font-weight: 700">Trip Tickets</h3>
  </div>
  <div class="card head-card mx-3 my-2 shadow" style="border-radius: 20px">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="fromInput" class="form-label">From</label>
          <input type="text" class="form-control" id="fromInput" />
        </div>
        <div class="mb-3">
          <label for="toInput" class="form-label">To</label>
          <input type="text" class="form-control" id="toInput" />
        </div>
        <div class="d-flex align-items-center mb-3">
          <div class="me-3" style="flex: 0 0 120px">
            <!-- Adjust width as needed -->
            <label for="departureDay" class="form-label">Departure Day</label>
            <input type="date" class="form-control" id="departureDay" />
          </div>

          <div class="d-flex flex-wrap">
            <ion-chip
              style="
                width: 140px;
                font-size: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-weight: 600;
              "
              [outline]="!isWeekendTrekSelected"
              (click)="toggleWeekendTrek()"
              [ngClass]="{'selected': isWeekendTrekSelected}"
            >
              <ion-label>Weekend Trek</ion-label>
              <ion-icon *ngIf="isWeekendTrekSelected" name="close"></ion-icon>
            </ion-chip>

            <ion-chip
              style="
                width: 140px;
                font-size: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-weight: 600;
              "
              [outline]="!isPersonalizedTrekSelected"
              (click)="togglePersonalizedTrek()"
              [ngClass]="{'selected':
              isPersonalizedTrekSelected}"
            >
              <ion-label>Personalized Trek</ion-label>
              <ion-icon
                *ngIf="isPersonalizedTrekSelected"
                name="close"
              ></ion-icon>
            </ion-chip>
          </div>
        </div>

        <div class="d-grid">
          <button
            type="submit"
            class="btn btn-warning rounded-pill"
            routerLink="trip-results"
          >
            <i class="fa-solid fa-shoe-prints"></i> Search
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="custom-card">
    <div class="top-trips-card">
      <div
        class="d-flex justify-content-between align-items-center section-header"
        style="margin-bottom: 0px"
      >
        <h2
          class="ms-3 mb-0"
          style="font-weight: 600; margin-top: 0; margin-bottom: 0"
        >
          Top Treks
        </h2>
        <ion-button fill="clear" size="small" routerLink="top-trips"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper">
          <div class="swiper-slide" *ngFor="let slide of slides">
            <ion-card
              class="card"
              routerLink="/tabs/Home/trip-details"
              style="
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
              "
            >
              <img
                routerLink="/tabs/Home/trip-details"
                [src]="slide.image"
                class=""
                alt="{{ slide.title }}"
                style="
                  width: 150px;
                  height: 90px;
                  border-radius: 20px;
                  overflow: hidden;
                  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                "
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>
    <div class="offers-card">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0px;
        "
      >
        <h2 class="ms-3 mb-0" style="font-weight: 600; margin-top: 0">
          Offers
        </h2>
        <ion-button fill="clear" size="small" routerLink="offers"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper">
          <!-- Iterate through each slide and make it clickable -->
          <div class="swiper-slide" *ngFor="let slide of slides1">
            <ion-card
              class="card"
              routerLink="/tabs/Home/offers"
              style="
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
              "
            >
              <img
                [src]="slide.image"
                class=""
                alt="{{ slide.title }}"
                style="width: 150px; height: 90px"
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>
    <div class="trek-shorts-card">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0px;
        "
      >
        <h2 class="ms-3 mb-0" style="font-weight: 600; margin-top: 0">
          Trek Shorts
        </h2>
        <ion-button fill="clear" size="small" routerLink="offers"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper">
          <!-- Iterate through each slide and make it clickable -->
          <div class="swiper-slide" *ngFor="let slide of slides2">
            <ion-card
              class="card"
              routerLink="/tabs/Home/offers"
              style="
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
              "
            >
              <img
                [src]="slide.image"
                class=""
                alt="{{ slide.title }}"
                style="width: 150px; height: 90px"
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>

    <div class="weather-section">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2 class="ms-3 mb-0" style="font-weight: 600; margin-top: 0">
          Weather Alerts
        </h2>
        <ion-button fill="clear" size="small" routerLink="#"
          >View More</ion-button
        >
      </div>
      <ion-card>
        <img src="assets/illustrations/weather-alert.jpg" />
      </ion-card>
      <ion-card>
        <img src="assets/illustrations/weather-alert.jpg" />
      </ion-card>
    </div>
  </div>
</ion-content>
