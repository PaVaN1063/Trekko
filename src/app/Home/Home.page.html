<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="handleRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="title" style="padding-left: 20px; font-weight: 500">
    <h3 style="font-weight: 700">Trip Tickets (Pa1)</h3>
  </div>
  <div class="card head-card mx-3 my-2 shadow" style="border-radius: 20px">
    <div class="card-body">
      <form (ngSubmit)="onSubmit()" #tripForm="ngForm">
        <div class="mb-3">
          <label for="fromInput" class="form-label">From</label>
          <input
            type="text"
            class="form-control"
            id="fromInput"
            [(ngModel)]="fromDay"
            name="from"
            required
          />
        </div>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Trip Tickets</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">From</ion-label>
        <ion-input type="text"></ion-input>
      </ion-item>

        <div class="mb-3">
          <label for="toInput" class="form-label">To</label>
          <input
            type="text"
            class="form-control"
            id="toInput"
            [(ngModel)]="toDay"
            name="to"
          />
        </div>

        <div class="d-flex align-items-center mb-3">
          <div class="me-3" style="flex: 0 0 120px">
            <label for="departureDay" class="form-label">Departure Day</label>
            <input
              type="date"
              class="form-control"
              id="departureDay"
              [(ngModel)]="departureDay"
              name="departureDay"
            />
          </div>

          <div class="d-flex flex-wrap">
            <ion-chip
              style="
                width: 140px;
                font-size: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-weight: 600;
              "
              [outline]="!isWeekendTrekSelected"
              (click)="toggleWeekendTrek()"
              [ngClass]="{'selected': isWeekendTrekSelected}"
            >
              <ion-label>Weekend Trek</ion-label>
              <ion-icon *ngIf="isWeekendTrekSelected" name="close"></ion-icon>
            </ion-chip>

            <ion-chip
              style="
                width: 140px;
                font-size: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-weight: 600;
              "
              [outline]="!isPersonalizedTrekSelected"
              (click)="togglePersonalizedTrek()"
              [ngClass]="{'selected': isPersonalizedTrekSelected}"
            >
              <ion-label>Personalized Trek</ion-label>
              <ion-icon
                *ngIf="isPersonalizedTrekSelected"
                name="close"
              ></ion-icon>
            </ion-chip>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-warning rounded-pill">
            <i class="fa-solid fa-shoe-prints"></i> Search
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="Section-2">
    <div class="top-trips-card">
      <div
        class="d-flex justify-content-between align-items-center section-header"
        style="margin-bottom: 0px"
      >
        <h2
          class="ms-3 mb-0"
          style="font-weight: 600; margin-top: 0; margin-bottom: 0"
        >
          Top Treks
        </h2>
        <ion-button fill="clear" size="small" routerLink="top-trips"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container" style="margin: 0">
        <div class="swiper-wrapper">
          <div class="swiper-slide" *ngFor="let slide of slides">
            <ion-card
              class="card"
              routerLink="/tabs/Home/trip-details"
              style="
                border-radius: 20px;
                overflow: hidden;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
              "
            >
              <img
                routerLink="/tabs/Home/trip-details"
                [src]="slide.image"
                class=""
                alt="{{ slide.title }}"
                style="
                  width: 150px;
                  height: 90px;
                  border-radius: 20px;
                  overflow: hidden;
                  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                "
              />
            </ion-card>
          </div>
        </div>
      </div>
    </div>
    <div class="offers-card">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2 style="padding-left: 20px">Top Treks</h2>
        <ion-button fill="clear" size="small" routerLink="top-trips"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide" *ngFor="let slide of slides">
            <ion-card routerLink="/tabs/Home/trip-details">
              <ion-card-content>
                <img [src]="slide.image" alt="{{ slide.title }}" />
              </ion-card-content>
            </ion-card>
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </div>

      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        
        "
      >
        <h2 style="padding-left: 20px">Offers</h2>
        <ion-button fill="clear" size="small" routerLink="offers"
          >View More</ion-button
        >
      </div>

      <div class="swiper-container">
        <div class="swiper-wrapper">
          <div class="swiper-slide" *ngFor="let slide of slides">
            <ion-card>
              <ion-card-content>
                <img [src]="slide.image" alt="{{ slide.title }}" />
              </ion-card-content>
            </ion-card>
          </div>
        </div>
        <div class="swiper-pagination"></div>
      </div>

     <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2 style="padding-left: 20px">Weather Alerts</h2>
    <ion-button fill="clear" size="small" routerLink="alerts">View More</ion-button>
  </div>

  <div class="swiper-container">
    <div class="swiper-wrapper">
      <div class="swiper-slide" *ngFor="let alert of weatherAlerts">
        <ion-card>
          <ion-card-content>
            <img [src]="alert.image" alt="{{ alert.title }}" />
          </ion-card-content>
        </ion-card>
      </div>
    </div>

    <div class="weather-section">
      <div
        class="section-header"
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
        "
      >
        <h2 class="ms-3 mb-0" style="font-weight: 600; margin-top: 0">
          Weather Alerts
        </h2>
        <ion-button fill="clear" size="small" routerLink="#"
          >View More</ion-button
        >
      </div>
      <ion-card>
        <img src="assets/illustrations/weather-alert.jpg" />
      </ion-card>
      <ion-card>
        <img src="assets/illustrations/weather-alert.jpg" />
      </ion-card>
    </div>
  </div>
</ion-content>
