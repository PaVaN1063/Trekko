<ion-content fullscreen class="auth">
  <div class="auth__screen">
    <section class="auth__hero">
      <img class="auth__contours" src="assets/illustrations/abstract.png" alt="" aria-hidden="true" />
      <button type="button" class="ab-icon-btn" aria-label="Back to log in" routerLink="/login" routerDirection="back">
        <ion-icon name="chevron-back"></ion-icon>
      </button>
      <h1 class="auth__headline rise">Join the trail.</h1>
      <p class="auth__tagline rise" style="--i: 1">Create your Trekko account to book treks and keep every ticket in one place.</p>
    </section>

    <section class="auth__sheet rise" style="--i: 2">
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span>Full name</span>
          <input formControlName="fullName" autocomplete="name" placeholder="As on your ID" />
          <small class="field-error" *ngIf="showError('fullName')">Enter your full name.</small>
        </label>

        <label class="field">
          <span>Email</span>
          <input formControlName="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
          <small class="field-error" *ngIf="showError('email')">Enter a valid email address.</small>
        </label>

        <label class="field">
          <span>Mobile number</span>
          <div class="prefix-input">
            <b>+91</b>
            <input formControlName="mobileNumber" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10-digit number" (input)="digitsOnly($event)" />
          </div>
          <small class="field-error" *ngIf="showError('mobileNumber')">Enter a valid 10-digit mobile number.</small>
        </label>

        <label class="check">
          <input type="checkbox" formControlName="terms" />
          <span>I agree to Trekko's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn-cta auth__submit" [disabled]="submitting">
          {{ submitting ? 'Creating account…' : 'Create account' }}
        </button>
      </form>

      <p class="auth__switch">Already have an account? <a routerLink="/login" routerDirection="back">Log in</a></p>
    </section>
  </div>
</ion-content>
