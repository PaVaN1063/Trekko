<ion-content [fullscreen]="true" [scrollY]="false" class="splash">
  <img class="splash__contours" src="assets/illustrations/abstract.png" alt="" aria-hidden="true" />

  <main class="splash__center">
    <div class="splash__logo">
      <span class="splash__halo" aria-hidden="true"></span>
      <img src="assets/brand/trekko-logo.webp" alt="Trekko" />
    </div>
    <h1 class="splash__word">Trekko</h1>
    <p class="splash__tag">Find your trail.</p>
  </main>

  <footer class="splash__trail" aria-label="Loading">
    <div class="splash__track">
      <div class="splash__fill" [style.width.%]="progressValue * 100"></div>
    </div>
  </footer>
</ion-content>
