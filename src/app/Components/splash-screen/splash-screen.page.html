<ion-content [fullscreen]="true" class="content-center">
  <div class="empty-space"></div>
  <div class="content-wrapper">
    <div class="logo-bg">
          <img src="assets/icon/hikingPerson.png" alt="Logo" class="logo" />
    </div>
    <ion-progress-bar
      [value]="progressValue"
      color="warning"
      class="custom-progress-bar"
    ></ion-progress-bar>
    <img src="assets/icon/splash_image.png" alt="Splash" class="splash-image" />
  </div>
</ion-content>
