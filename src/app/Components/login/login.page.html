<ion-content class="ion-padding" fullscreen scroll-y="false">
  <form [formGroup]="loginForm">
    <div class="container">
      <div class="empty-space">

      </div>
      <div class="highlight-text">
        <h1 style="font-size: 1.8rem; font-weight: bold; line-height: 1; color: #ffffff;line-height: 35px;">
          <span class="text_your_trek">Your Trek,</span><br />
          Just a<br />Click<br />Away<span style="color: yellow;">!</span>
        </h1>
      </div>

      <div class="form-container">
        <!-- Phone Input -->
        <ion-input
          type="text"
          placeholder="Phone Number or Email"
          formControlName="phoneno"
          class="input-field"
        ></ion-input>

        <div class="otp-button-container">
          <!-- Send OTP Button -->
          <ion-button id="open-modal" expand="block" shape="round" (click)="sendOtp()">
            Continue
          </ion-button>
        </div>
      </div>

      <div class="image-container">
        <ion-img src="/assets/illustrations/abstract.png" alt="Illustration"></ion-img>
      </div>

      <div class="agreement-content">
        <div class="poppins-regular">
          <span>By continuing, you agree to our</span>
          <br/>
          <a id="agreement-text" routerDirection="forward" href="#">Terms of Use & Privacy Policy</a>
        </div>
      </div>
    </div>
  </form>
</ion-content>


<ion-modal trigger="open-modal" (willDismiss)="onWillDismiss($event)">
  <ng-template>
    <ion-content class="ion-padding">
      <ion-button class="BackToLogin" (click)="cancel()">
        <ion-icon slot="icon-only" ios="chevron-back" md="chevron-back"></ion-icon>
      </ion-button>
      <!-- <div class="icon-wrapper" (click)="goToHome()">
        <ion-icon name="chevron-back"></ion-icon>
      </div> -->
      <!-- <ion-icon name="chevron-back" (click)="goToHome()"></ion-icon> -->
        <ion-grid id="myotp" mode="ios" class="ion-text-center">
          <ion-row id="myotpgridrow" mode="ios">
            <ion-col id="myotpgridrowcol1" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp1"
                id="myotpotp1"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
            <ion-col id="myotpgridrowcol2" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp2"
                id="myotpotp2"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
            <ion-col id="myotpgridrowcol3" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp3"
                id="myotpotp3"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
            <ion-col id="myotpgridrowcol4" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp4"
                id="myotpotp4"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
            <ion-col id="myotpgridrowcol5" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp5"
                id="myotpotp5"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
            <ion-col id="myotpgridrowcol6" mode="ios" size="2">
              <ion-input
                [(ngModel)]="otp6"
                id="myotpotp6"
                fill="outline"
                maxlength="1"
                minlength="1"
                mode="md"
                type="tel"
                class="myotpotp"
                style="--border-radius: 10px"
              >
              </ion-input>
            </ion-col>
          </ion-row>
        </ion-grid>
      <div class="countdown-timer" *ngIf="countdown > 0">
        <p>Resend OTP in {{ countdown }} seconds</p>
      </div>

      <div *ngIf="countdown === 0">
        <ion-text color="primary" (click)="resendOtp()">Resend OTP</ion-text>
      </div>

      <ion-button expand="block" shape="round" color="dark" (click)="confirm()">
        Submit OTP
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>
