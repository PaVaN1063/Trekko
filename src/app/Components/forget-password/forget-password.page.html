<ion-content fullscreen class="auth">
  <div class="auth__screen">
    <section class="auth__hero">
      <img class="auth__contours" src="assets/illustrations/abstract.png" alt="" aria-hidden="true" />
      <button type="button" class="ab-icon-btn" aria-label="Back to log in" routerLink="/login" routerDirection="back">
        <ion-icon name="chevron-back"></ion-icon>
      </button>
      <h1 class="auth__headline rise">Changed your number?</h1>
      <p class="auth__tagline rise" style="--i: 1">Enter the email on your Trekko account. We'll send a link to move your account to a new mobile number.</p>
    </section>

    <section class="auth__sheet rise" style="--i: 2">
      <ng-container *ngIf="!sent; else sentTpl">
        <form (ngSubmit)="send()" #f="ngForm">
          <label class="field">
            <span>Email</span>
            <input name="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" [(ngModel)]="email" required email />
          </label>
          <button type="submit" class="btn-cta auth__submit" [disabled]="f.invalid">Send recovery link</button>
        </form>
      </ng-container>

      <ng-template #sentTpl>
        <div class="sent">
          <div class="sent__icon"><ion-icon name="mail-open-outline"></ion-icon></div>
          <h2>Check your inbox</h2>
          <p class="muted">We sent a recovery link to <b>{{ email }}</b>. It expires in 30 minutes.</p>
          <button type="button" class="btn-ghost" (click)="sent = false">Use a different email</button>
        </div>
      </ng-template>

      <p class="auth__switch">Remembered it? <a routerLink="/login" routerDirection="back">Log in</a></p>
    </section>
  </div>
</ion-content>
