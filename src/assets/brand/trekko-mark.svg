    <!-- switchback trail -->
    <path d="M232 540 C 232 486, 330 476, 330 434 C 330 392, 222 392, 226 352 C 230 314, 300 312, 292 274 C 286 248, 268 236, 264 214"
          fill="none" stroke="#F8EB4D" stroke-width="15" stroke-linecap="round" stroke-dasharray="1 27"/>
  </g>
  <!-- summit flag -->
