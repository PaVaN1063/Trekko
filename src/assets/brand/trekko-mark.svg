<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Trekko">
  <defs>
    <clipPath id="tk-c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="256" fill="#F8EB4D"/>
